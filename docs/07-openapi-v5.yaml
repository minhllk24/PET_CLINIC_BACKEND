          type: boolean
        depositType:
          $ref: '#/components/schemas/DepositType'
        depositValue:
          type: number
      allOf:
      - if:
          properties:
            depositRequired:
              const: true
          required:
          - depositRequired
        then:
          properties:
            depositType:
              const: PERCENTAGE
            depositValue:
              const: 30
          required:
          - depositValue
      - if:
          properties:
            depositRequired:
              const: false
          required:
          - depositRequired
        then:
          properties:
            depositType:
              const: NONE
