components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
  responses:
    ValidationError:
      description: 400/422 VALIDATION_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 AUTHENTICATION_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 AUTHORIZATION_ERROR | OWNERSHIP_ERROR | BRANCH_SCOPE_ERROR | ASSIGNMENT_SCOPE_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 NOT_FOUND (cung dung de che giau ton tai)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 CONFLICT | SLOT_UNAVAILABLE | SHIFT_OVERLAP | IDEMPOTENCY_KEY_REUSED | INVALID_STATE_TRANSITION
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: '422 business rule: RESCHEDULE_TOO_LATE | RESCHEDULE_LIMIT | MIXED_SERVICE_TYPES | INCOMPATIBLE_STAFF_ROLES | SERVICE_NOT_ENABLED_AT_BRANCH | BOOKING_MODE_NOT_ALLOWED | INSUFFICIENT_INVENTORY
        | PAYMENT_STATE_ERROR | REFUND_STATE_ERROR | RETURN_WINDOW_EXPIRED | RETURN_QTY_EXCEEDS_RETURNABLE | MEDICAL_REVIEW_REQUIRED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 RATE_LIMIT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ObjectId:
      type: string
      pattern: ^[a-f0-9]{24}$
    Money:
      type: integer
      minimum: 0
      description: VND
    DateTime:
      type: string
      format: date-time
    SystemRole:
      type: string
      enum:
      - ADMIN
      - MANAGER
      - STAFF
      - CUSTOMER
    StaffSubRole:
      type: string
      enum:
      - RECEPTIONIST
      - CARE_STAFF_GROOMER
      - VETERINARIAN
      - NURSE
    ActivationStatus:
      type: string
      enum:
      - NO_ACCOUNT
      - PENDING_ACTIVATION
      - ACTIVATED
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
    BookingMode:
      type: string
      enum:
      - BOOKABLE
      - REQUEST_ONLY
      - CONTACT_ONLY
    DepositType:
      type: string
      enum:
      - NONE
      - PERCENTAGE
    AppointmentStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - PENDING_CONFIRMATION
      - CONFIRMED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_SHOW
    DepositStatus:
      type: string
      enum:
      - NOT_REQUIRED
      - PENDING
      - HELD
      - APPLIED
      - REFUNDED
      - FORFEITED
      - TRANSFERRED
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - FAILED
      - CANCELLED
      - EXPIRED
      - REFUND_PENDING
      - REFUNDED
    BookingRefundStatus:
      type: string
      enum:
      - REQUESTED
      - PROCESSING
      - APPROVED
      - REJECTED
      - REFUNDED
    OrderRefundStatus:
      type: string
      enum:
      - PENDING
      - REFUNDED
      - FAILED
    ServiceRecordStatus:
      type: string
      enum:
      - DRAFT
      - IN_PROGRESS
      - WAITING_VET_REVIEW
      - FINALIZED
      - REOPENED
    InventoryTxType:
      type: string
      enum:
      - RECEIPT
      - ISSUE
      - ADJUSTMENT
      - TRANSFER
    ActiveStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    ShiftStatus:
      type: string
      enum:
      - ACTIVE
      - CANCELLED
    Problem:
      type: object
      description: RFC 9457 + extensions
      required:
      - type
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
            additionalProperties: false
        suggestedGroups:
          type: array
          description: Goi y tach lich khi INCOMPATIBLE_STAFF_ROLES
          items:
            type: object
            properties:
              requiredStaffRole:
                $ref: '#/components/schemas/StaffSubRole'
              serviceIds:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectId'
            additionalProperties: false
            required:
            - requiredStaffRole
            - serviceIds
      additionalProperties: true
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - AUTHENTICATION_ERROR
      - AUTHORIZATION_ERROR
      - OWNERSHIP_ERROR
      - BRANCH_SCOPE_ERROR
      - ASSIGNMENT_SCOPE_ERROR
      - NOT_FOUND
      - CONFLICT
      - SLOT_UNAVAILABLE
      - SHIFT_OVERLAP
      - IDEMPOTENCY_KEY_REUSED
      - INVALID_STATE_TRANSITION
      - RESCHEDULE_TOO_LATE
      - RESCHEDULE_LIMIT
      - MIXED_SERVICE_TYPES
      - INCOMPATIBLE_STAFF_ROLES
      - SERVICE_NOT_ENABLED_AT_BRANCH
      - BOOKING_MODE_NOT_ALLOWED
      - INSUFFICIENT_INVENTORY
      - PAYMENT_STATE_ERROR
      - REFUND_STATE_ERROR
      - RETURN_WINDOW_EXPIRED
      - RETURN_QTY_EXCEEDS_RETURNABLE
      - MEDICAL_REVIEW_REQUIRED
      - EXTERNAL_PROVIDER_ERROR
      - RATE_LIMIT
      - INTERNAL_ERROR
      - PRODUCT_NOT_PURCHASABLE
      - VOUCHER_INVALID
      - ORDER_NOT_RETURNABLE
      - FULFILLMENT_NOT_CONFIGURED
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/Me'
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - expiresIn
    Me:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        fullName:
          type: string
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        systemRole:
          $ref: '#/components/schemas/SystemRole'
        staffSubRole:
          oneOf:
          - $ref: '#/components/schemas/StaffSubRole'
          - type: 'null'
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        activationStatus:
          $ref: '#/components/schemas/ActivationStatus'
        lastLogin:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        branchScope:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
      additionalProperties: false
      required:
      - id
      - systemRole
      - accountStatus
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: email hoac phone
        password:
          type: string
          minLength: 8
      additionalProperties: false
      required:
      - identifier
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      additionalProperties: false
      required:
      - refreshToken
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          pattern: ^0[0-9]{9}$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*[0-9]).{8,}$
          description: Toi thieu 8 ky tu, co chu hoa va so
        acceptTerms:
          type: boolean
          const: true
        otp:
