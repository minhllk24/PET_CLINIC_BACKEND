openapi: 3.1.1
info:
  title: Pet Clinic Web 2 API (greenfield)
  version: 6.0.0
  description: 'Canonical contract v6 (appointment staffing + payment flow) cho backend moi. Hai FE dich: Customer Angular
    va Admin Angular (x-audience). Error: RFC 9457. Khong tuong thich nguoc voi backend cu. Versioning: URI major /api/v1
    (API contract version 1 cua backend moi; tai lieu v2 la revision cua bo spec).'
servers:
- url: /api/v1
tags:
- name: Auth
- name: Guest
- name: Activation
- name: Customers
- name: Pets
- name: Branches
- name: Branch Service Config
- name: Service Catalog
- name: Staff
- name: Shifts
- name: Booking
- name: Execution
- name: Inventory
- name: Payment
- name: Refund
- name: Return
- name: Review
- name: Dashboard
- name: Cart
- name: Catalog
- name: Checkout
- name: Notification
- name: Order
- name: Services
- name: Settings
- name: Voucher
paths:
  /auth/login:
    post:
      operationId: authLogin
      summary: Dang nhap (cap nhat lastLogin khi thanh cong)
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: none
        roles:
        - public
        scope: n/a
        audit: auth.login.success|failed
        sideEffects: lastLogin=now on success only; failedLoginCount reset
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate refresh token
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: refresh token
        roles:
        - public
        scope: n/a
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke refresh family
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-authz:
        auth: bearer
        roles:
        - any authenticated
        scope: own session
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/register:
    post:
      operationId: authRegister
      summary: Dang ky Customer (tao password truc tiep)
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: none
        roles:
        - public
        scope: n/a
        sideEffects: customers.activationStatus=ACTIVATED
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      summary: Gui OTP dat lai mat khau (email hoac phone)
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted (khong tiet lo account ton tai)
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: none
        roles:
        - public
        scope: n/a
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/reset-password:
    post:
      operationId: authResetPassword
      summary: Dat lai mat khau bang OTP
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: OTP
        roles:
        - public
        scope: n/a
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/otp/resend:
    post:
      operationId: authOtpResend
      summary: Gui lai OTP (cooldown 30s)
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: none
        roles:
        - public
        scope: n/a
        resolver: Identity/Self
      x-audience:
      - customer
  /auth/me:
    get:
      operationId: authMe
      summary: Ho so cua toi
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-authz:
        auth: bearer
        roles:
        - any authenticated
        scope: own
        resolver: Identity/Self
      x-audience:
      - customer
  /guest/lookup/otp:
    post:
      operationId: guestLookupRequestOtp
      summary: Yeu cau OTP tra cuu giao dich guest
      tags:
      - Guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestOtpRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOtpChallenge'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: none
        roles:
        - public
        scope: phone/email cua chinh nguoi yeu cau
        resolver: Identity/Self
        sideEffects: Tao otp_challenge hash + TTL 5 phut; challengeId la ID duy nhat; OTP one-time va 5 attempts.
      x-audience:
      - customer
  /guest/lookup/verify:
    post:
      operationId: guestLookupVerifyOtp
      summary: Xac thuc OTP, tra lookup token ngan han
      tags:
      - Guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestOtpVerify'
      responses:
        '200':
          description: Lookup token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLookupToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: OTP
        roles:
        - public
        scope: contact da verify
        resolver: Identity/Self
        sideEffects: Verify challengeId + OTP; thanh cong mot lan -> tra lookup token ngan han; challenge da consumed 
          thi reject.
      x-audience:
      - customer
  /guest/transactions:
    get:
      operationId: guestTransactionsList
      summary: Order/appointment cua guest (lookup token)
      tags:
      - Guest
      security:
      - guestLookupToken: []
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestTransactionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-authz:
        auth: lookup token
        roles:
        - guest(verified)
        scope: contact da verify cua lookup token; token khong phai JWT.
        resolver: Identity/Self
      x-audience:
      - customer
  /activation/invitations:
    post:
      operationId: activationInviteSend
      summary: Gui moi kich hoat sau giao dich guest
      tags:
      - Activation
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationInviteRequest'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: system/bearer
        roles:
        - system
        - RECEPTIONIST
        - MANAGER
        - ADMIN
        scope: branch resolver cua resource (xem 08)
        audit: activation.invite
        sideEffects: customers.activationStatus=PENDING_ACTIVATION; outbox email/sms
        idempotency: Idempotency-Key required; same key+same body returns original result; same key+different body -> 
          409 IDEMPOTENCY_KEY_REUSED
        resolver: Identity/Self
      x-audience:
      - admin
  /activation/complete:
    post:
      operationId: activationComplete
      summary: Verify OTP + dat password => ACTIVATED + link giao dich
      tags:
      - Activation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCompleteRequest'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-authz:
        auth: OTP
        roles:
        - public
        scope: contact da verify
        stateTransition: PENDING_ACTIVATION->ACTIVATED
        sideEffects: link guest transactions co phone/email da verify
        resolver: Identity/Self
      x-audience:
      - customer
  /admin/customers:
    get:
      operationId: adminCustomersList
      summary: Danh sach customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: activationStatus
        in: query
        schema:
          type: string
          enum:
          - NO_ACCOUNT
          - PENDING_ACTIVATION
          - ACTIVATED
      - name: accountStatus
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: bearer
        roles:
        - MANAGER
        - ADMIN
        scope: 'MANAGER: Customer activity -> Order.fulfillmentBranchId / Appointment.branchId trong assignedBranchIds (khong
          co truong branch tren Customer); ADMIN: ALL'
        resolver: Customer
      x-audience:
      - admin
  /admin/customers/{id}:
    get:
      operationId: adminCustomerGet
      summary: Chi tiet customer (kem lastLogin, trang thai)
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: bearer
        roles:
        - MANAGER
        - ADMIN
        scope: 'MANAGER: Customer activity -> Order.fulfillmentBranchId / Appointment.branchId trong assignedBranchIds (khong
          co truong branch tren Customer); ADMIN: ALL'
        resolver: Customer
      x-audience:
      - admin
  /admin/customers/{id}/block:
    post:
      operationId: adminCustomerBlock
      summary: Khoa account
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-authz:
        auth: bearer
        roles:
        - ADMIN
        scope: 'ADMIN: ALL Customer records'
        stateTransition: ACTIVE->BLOCKED
        audit: account.block
        sideEffects: revoke refresh sessions
        resolver: Customer
        idempotency: Idempotency-Key required; same key+same body returns original result; same key+different body -> 
          409 IDEMPOTENCY_KEY_REUSED
      x-audience:
      - admin
  /admin/customers/{id}/unblock:
    post:
      operationId: adminCustomerUnblock
      summary: Mo khoa account
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-authz:
        auth: bearer
        roles:
        - ADMIN
        scope: 'ADMIN: ALL Customer records'
        stateTransition: BLOCKED->ACTIVE
        audit: account.unblock
        resolver: Customer
        idempotency: Idempotency-Key required; same key+same body returns original result; same key+different body -> 
          409 IDEMPOTENCY_KEY_REUSED
      x-audience:
      - admin
  /pets:
    get:
      operationId: petsList
      summary: Pet cua toi
      tags:
      - Pets
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: bearer
        roles:
        - CUSTOMER
        scope: 'Customer: pet.customerId == actor. Staff: qua Appointment/ServiceRecord duoc giao. Manager: Customer activity
          -> branch cua Order/Appointment/ServiceRecord trong assignedBranchIds. ADMIN: ALL'
        resolver: Pet
      x-audience:
      - customer
    post:
      operationId: petsCreate
      summary: Tao pet
      tags:
      - Pets
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreate'
      responses:
        '201':
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-authz:
        auth: bearer
        roles:
        - CUSTOMER
        scope: 'Customer: pet.customerId == actor. Staff: qua Appointment/ServiceRecord duoc giao. Manager: Customer activity
          -> branch cua Order/Appointment/ServiceRecord trong assignedBranchIds. ADMIN: ALL'
        resolver: Pet
        idempotency: Idempotency-Key required; same key+same body returns original result; same key+different body -> 
          409 IDEMPOTENCY_KEY_REUSED
      x-audience:
      - customer
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /pets/{id}:
    get:
      operationId: petsGet
      summary: Chi tiet pet
      tags:
      - Pets
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: bearer
        roles:
        - CUSTOMER
        - STAFF(assigned appointment)
        - MANAGER
        - ADMIN
        scope: 'Customer: pet.customerId == actor. Staff: qua Appointment/ServiceRecord duoc giao. Manager: Customer activity
          -> branch cua Order/Appointment/ServiceRecord trong assignedBranchIds. ADMIN: ALL'
        resolver: Pet
      x-audience:
      - customer
      - admin
    patch:
      operationId: petsUpdate
      summary: Sua pet
      tags:
      - Pets
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        '200':
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-authz:
        auth: bearer
        roles:
        - CUSTOMER
        - ADMIN
        scope: 'Customer: pet.customerId == actor. Staff: qua Appointment/ServiceRecord duoc giao. Manager: Customer activity
          -> branch cua Order/Appointment/ServiceRecord trong assignedBranchIds. ADMIN: ALL'
        resolver: Pet
      x-audience:
      - customer
      - admin
  /pets/{id}/archive:
    post:
      operationId: petsArchive
      summary: An/archive pet
      tags:
      - Pets
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: bearer
        roles:
        - CUSTOMER
        - ADMIN
        scope: 'Customer: pet.customerId == actor. Staff: qua Appointment/ServiceRecord duoc giao. Manager: Customer activity
          -> branch cua Order/Appointment/ServiceRecord trong assignedBranchIds. ADMIN: ALL'
        resolver: Pet
        idempotency: Idempotency-Key required; same key+same body returns original result; same key+different body -> 
          409 IDEMPOTENCY_KEY_REUSED
      x-audience:
      - customer
      - admin
  /branches:
    get:
      operationId: branchesList
      summary: Danh sach chi nhanh
      tags:
      - Branches
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '400':
          $ref: '#/components/responses/ValidationError'
      x-authz:
        auth: none
        roles:
        - public
        scope: public fields
        resolver: Branch
      x-audience:
      - customer
    post:
      operationId: branchesCreate
      summary: Tao chi nhanh
      tags:
      - Branches
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchWrite'
      responses:
        '201':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
