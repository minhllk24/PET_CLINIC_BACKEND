          PENDING_PAYMENT cho den khi coc thanh cong; khong coc => PENDING_CONFIRMATION. PENDING_PAYMENT va PENDING_CONFIRMATION
          deu co holdExpiresAt; het han auto-CANCELLED + release reservation; confirmation timeout neu co prepayment thi tao
          BookingRefund 100%. Customer chon pet khac => tu luu pet moi.'
