      x-authz:
        auth: bearer
        roles:
        - ADMIN
        scope: GLOBAL. ADMIN
        audit: settings.commerce.update
        sideEffects: 'fulfillmentBranchPriority: moi phan tu phai la branch ton tai'
        resolver: Settings
      x-audience:
      - admin
  /appointments/{id}/segments/{serviceId}/staff:
    put:
      operationId: appointmentSegmentReassign
      summary: Doi staff cho tung service segment (role trung voi requiredStaffRole cua segment, dang available)
      tags:
      - Booking
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      - name: serviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffReassignRequest'
      responses:
        '200':
          description: Appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-authz:
        auth: bearer
        roles:
        - RECEPTIONIST
        - MANAGER
        - ADMIN
        scope: 'Receptionist: Appointment.branchId trong authorizedBranchIds; Manager: Appointment.branchId trong assignedBranchIds;
          ADMIN ALL'
        audit: appointment.segment.reassign
        sideEffects: Staff moi phai dung ServiceExecutionRole/requiredStaffRole, authorized, shift, non-overlap. Segment
          phai NOT_STARTED; transaction CAS Appointment.version + release old STAFF reservation + hold new STAFF 
          reservation.
        resolver: Appointment
      x-audience:
      - admin
  /booking-refunds/{id}:
    get:
      operationId: bookingRefundGet
      summary: Chi tiet booking refund
      tags:
      - Refund
      security:
      - guestLookupToken: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Booking refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRefund'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: guest lookup token or bearer
        roles:
        - CUSTOMER
        - guest(lookup token)
        - RECEPTIONIST
        - MANAGER
        - ADMIN
        scope: 'Customer: Appointment.customerId == actor; Guest: X-Guest-Lookup-Token resolves appointment guestContactId;
          Staff/Manager: Appointment.branchId in scope; ADMIN ALL'
        resolver: BookingRefund
      x-audience:
      - customer
      - admin
  /appointment-requests/{id}:
    get:
      operationId: appointmentRequestsGet
      summary: Chi tiet appointment request
      tags:
      - Booking
      security:
      - guestLookupToken: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-authz:
        auth: guest lookup token or bearer
        roles:
        - CUSTOMER
        - guest(lookup token)
        - RECEPTIONIST
        - MANAGER
        - ADMIN
        scope: 'Customer: own request; Guest: X-Guest-Lookup-Token resolves guestContactId; Staff/Manager: preferredBranchId/target
          branch in scope; ADMIN ALL'
        resolver: AppointmentRequest
      x-audience:
      - customer
      - admin
  /appointment-requests/{id}/cancel:
    post:
      operationId: appointmentRequestsCancel
      summary: Huy appointment request
      tags:
      - Booking
      security:
      - guestLookupToken: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-authz:
        auth: guest lookup token or bearer
        roles:
        - CUSTOMER
        - guest(lookup token)
        scope: 'Customer: own request; Guest: X-Guest-Lookup-Token resolves guestContactId'
        stateTransition: SUBMITTED|UNDER_REVIEW->CANCELLED
        audit: appointment_request.cancel
        resolver: AppointmentRequest
        idempotency: Idempotency-Key required; same key+same body returns original result; same key+different body -> 
          409 IDEMPOTENCY_KEY_REUSED
      x-audience:
      - customer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestLookupToken:
      type: apiKey
      in: header
      name: X-Guest-Lookup-Token
      description: Token ngan han tra ve sau guestLookupVerifyOtp; dung de truy cap order/appointment da verify.
    guestCartToken:
      type: apiKey
      in: header
      name: X-Guest-Cart-Token
      description: Opaque guest cart token; send as X-Guest-Cart-Token. Used only for guest cart and checkout endpoints.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
  responses:
    ValidationError:
      description: 400/422 VALIDATION_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 401 AUTHENTICATION_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 AUTHORIZATION_ERROR | OWNERSHIP_ERROR | BRANCH_SCOPE_ERROR | ASSIGNMENT_SCOPE_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 NOT_FOUND (cung dung de che giau ton tai)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 CONFLICT | SLOT_UNAVAILABLE | SHIFT_OVERLAP | IDEMPOTENCY_KEY_REUSED | INVALID_STATE_TRANSITION
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: '422 business rule: RESCHEDULE_TOO_LATE | RESCHEDULE_LIMIT | MIXED_SERVICE_TYPES | STAFF_ROLE_MISMATCH
        | STAFF_UNAVAILABLE | SERVICE_NOT_ENABLED_AT_BRANCH | BOOKING_MODE_NOT_ALLOWED | INSUFFICIENT_INVENTORY | PAYMENT_STATE_ERROR
        | REFUND_STATE_ERROR | RETURN_WINDOW_EXPIRED | RETURN_QTY_EXCEEDS_RETURNABLE | MEDICAL_REVIEW_REQUIRED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 RATE_LIMIT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ObjectId:
      type: string
      pattern: ^[a-f0-9]{24}$
    Money:
      type: integer
      minimum: 0
      description: VND
    DateTime:
      type: string
      format: date-time
    SystemRole:
      type: string
      enum:
      - ADMIN
      - MANAGER
      - STAFF
      - CUSTOMER
    StaffSubRole:
      type: string
      enum:
      - RECEPTIONIST
      - CARE_STAFF_GROOMER
      - VETERINARIAN
      - NURSE
    ActivationStatus:
      type: string
      enum:
      - NO_ACCOUNT
      - PENDING_ACTIVATION
      - ACTIVATED
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
    BookingMode:
      type: string
      enum:
      - BOOKABLE
      - REQUEST_ONLY
      - CONTACT_ONLY
    DepositType:
      type: string
      enum:
      - NONE
      - PERCENTAGE
    AppointmentStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - PENDING_CONFIRMATION
      - CONFIRMED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_SHOW
    DepositStatus:
      type: string
      enum:
      - NOT_REQUIRED
      - PENDING
      - HELD
      - APPLIED
      - REFUNDED
      - FORFEITED
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - FAILED
      - CANCELLED
      - EXPIRED
      - REFUND_PENDING
      - REFUNDED
    BookingRefundStatus:
      type: string
      enum:
      - REQUESTED
      - PROCESSING
      - APPROVED
      - REJECTED
      - REFUNDED
    OrderRefundStatus:
      type: string
      enum:
      - PENDING
      - REFUNDED
      - FAILED
    ServiceRecordStatus:
      type: string
      enum:
      - DRAFT
      - IN_PROGRESS
      - WAITING_VET_REVIEW
      - FINALIZED
      - REOPENED
    InventoryTxType:
      type: string
      enum:
      - RECEIPT
      - ISSUE
      - ADJUSTMENT
      - TRANSFER
    ActiveStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    ShiftStatus:
      type: string
      enum:
      - ACTIVE
      - CANCELLED
    Problem:
      type: object
      description: RFC 9457 + extensions
      required:
      - type
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
            additionalProperties: false
      additionalProperties: true
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - AUTHENTICATION_ERROR
      - AUTHORIZATION_ERROR
      - OWNERSHIP_ERROR
      - BRANCH_SCOPE_ERROR
      - ASSIGNMENT_SCOPE_ERROR
      - NOT_FOUND
      - CONFLICT
      - SLOT_UNAVAILABLE
      - SHIFT_OVERLAP
      - IDEMPOTENCY_KEY_REUSED
      - INVALID_STATE_TRANSITION
      - RESCHEDULE_TOO_LATE
      - RESCHEDULE_LIMIT
      - MIXED_SERVICE_TYPES
      - SERVICE_NOT_ENABLED_AT_BRANCH
      - BOOKING_MODE_NOT_ALLOWED
      - INSUFFICIENT_INVENTORY
      - PAYMENT_STATE_ERROR
      - REFUND_STATE_ERROR
      - RETURN_WINDOW_EXPIRED
      - RETURN_QTY_EXCEEDS_RETURNABLE
      - MEDICAL_REVIEW_REQUIRED
      - EXTERNAL_PROVIDER_ERROR
      - RATE_LIMIT
      - INTERNAL_ERROR
      - PRODUCT_NOT_PURCHASABLE
      - VOUCHER_INVALID
      - ORDER_NOT_RETURNABLE
      - FULFILLMENT_NOT_CONFIGURED
      - STAFF_ROLE_MISMATCH
      - STAFF_UNAVAILABLE
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/Me'
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - expiresIn
    Me:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        fullName:
          type: string
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        systemRole:
          $ref: '#/components/schemas/SystemRole'
        staffSubRole:
          oneOf:
          - $ref: '#/components/schemas/StaffSubRole'
          - type: 'null'
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        activationStatus:
          $ref: '#/components/schemas/ActivationStatus'
        lastLogin:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        branchScope:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
      additionalProperties: false
      required:
      - id
      - systemRole
      - accountStatus
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: email hoac phone
        password:
          type: string
          minLength: 8
      additionalProperties: false
      required:
      - identifier
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      additionalProperties: false
      required:
      - refreshToken
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          pattern: ^0[0-9]{9}$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*[0-9]).{8,}$
          description: Toi thieu 8 ky tu, co chu hoa va so
        acceptTerms:
          type: boolean
          const: true
        otp:
          type: string
      additionalProperties: false
      required:
      - fullName
      - phone
      - password
      - acceptTerms
    ForgotPasswordRequest:
      type: object
      properties:
        identifier:
          type: string
      additionalProperties: false
      required:
      - identifier
    ResetPasswordRequest:
      type: object
      properties:
        identifier:
          type: string
        otp:
          type: string
          pattern: ^[0-9]{6}$
        newPassword:
          type: string
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*[0-9]).{8,}$
          description: Toi thieu 8 ky tu, co chu hoa va so
      additionalProperties: false
      required:
      - identifier
      - otp
      - newPassword
    OtpResendRequest:
      type: object
      properties:
        identifier:
          type: string
        purpose:
          type: string
          enum:
          - LOGIN
          - RESET
          - GUEST_LOOKUP
          - ACTIVATION
      additionalProperties: false
      required:
      - identifier
      - purpose
    GuestOtpRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: ^0[0-9]{9}$
        email:
          type: string
          format: email
      additionalProperties: false
      oneOf:
      - required:
        - phone
        not:
          required:
          - email
      - required:
        - email
        not:
          required:
          - phone
      description: Gui dung mot trong phone/email.
    GuestOtpVerify:
      type: object
      properties:
        challengeId:
          $ref: '#/components/schemas/ObjectId'
        otp:
          type: string
          pattern: ^[0-9]{6}$
      additionalProperties: false
      required:
      - challengeId
      - otp
    GuestLookupToken:
      type: object
      properties:
        lookupToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - lookupToken
      - expiresIn
      description: Opaque short-lived token issued only after successful OTP verification; send as X-Guest-Lookup-Token.
        Used for guest transaction/request/appointment/refund lookup and guest-owned actions.
    GuestTransactionList:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
      additionalProperties: false
    ActivationInviteRequest:
      type: object
      properties:
        guestContactId:
          $ref: '#/components/schemas/ObjectId'
      additionalProperties: false
      required:
      - guestContactId
    ActivationCompleteRequest:
      type: object
      properties:
        token:
          type: string
        otp:
          type: string
        password:
          type: string
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*[0-9]).{8,}$
          description: Toi thieu 8 ky tu, co chu hoa va so
        acceptTerms:
          type: boolean
          const: true
      additionalProperties: false
      required:
      - token
      - otp
      - password
      - acceptTerms
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
      required:
      - reason
    NoteRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
      additionalProperties: false
    OverrideRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
        outcome:
          type: string
          enum:
          - REFUND_100
          - NO_REFUND
          - TRANSFER
      additionalProperties: false
      required:
      - reason
      - outcome
    CustomerDetail:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        fullName:
          type: string
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        activationStatus:
          $ref: '#/components/schemas/ActivationStatus'
        accountStatus:
          oneOf:
          - $ref: '#/components/schemas/AccountStatus'
          - type: 'null'
          description: Null khi Customer chưa có User (activationStatus=NO_ACCOUNT hoặc PENDING_ACTIVATION).
        lastLogin:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        blockedReason:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - id
      - activationStatus
    CustomerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerDetail'
        nextCursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
    Pet:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        species:
          type: string
        speciesOther:
          type:
          - string
          - 'null'
        breed:
          type:
          - string
          - 'null'
        ageMonths:
          type:
          - integer
          - 'null'
        weightKg:
          type:
          - number
          - 'null'
        photoUrl:
          type:
          - string
          - 'null'
        health:
          type:
          - object
          - 'null'
        archived:
          type: boolean
      additionalProperties: false
      required:
      - id
      - name
      - species
    PetCreate:
      type: object
      properties:
        name:
          type: string
        species:
          type: string
        speciesOther:
          type:
          - string
          - 'null'
        breed:
          type:
          - string
          - 'null'
        ageMonths:
          type:
          - integer
          - 'null'
        weightKg:
          type:
          - number
          - 'null'
        photoUrl:
          type:
          - string
          - 'null'
        health:
          type:
          - object
          - 'null'
      additionalProperties: false
      required:
      - name
      - species
    PetUpdate:
      type: object
      properties:
        name:
          type: string
        species:
          type: string
        speciesOther:
          type:
          - string
          - 'null'
        breed:
          type:
          - string
          - 'null'
        ageMonths:
          type:
          - integer
          - 'null'
        weightKg:
          type:
          - number
          - 'null'
        photoUrl:
          type:
          - string
          - 'null'
        health:
          type:
          - object
          - 'null'
      additionalProperties: false
    PetPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        nextCursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
    Branch:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        code:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        status:
          $ref: '#/components/schemas/ActiveStatus'
        openingHours:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              open:
                type: string
              close:
                type: string
            additionalProperties: false
            required:
            - dayOfWeek
            - open
            - close
        holidays:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              note:
                type: string
            additionalProperties: false
      additionalProperties: false
      required:
      - id
      - name
      - status
    BranchWrite:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        openingHours:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              open:
                type: string
              close:
                type: string
            additionalProperties: false
            required:
            - dayOfWeek
            - open
            - close
        holidays:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              note:
                type: string
            additionalProperties: false
      additionalProperties: false
      required:
      - name
      - address
    BranchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        nextCursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
    DepositConfig:
      type: object
      additionalProperties: false
      required:
      - depositRequired
      - depositType
      properties:
        depositRequired:
          type: boolean
        depositType:
          $ref: '#/components/schemas/DepositType'
        depositValue:
          type: number
      allOf:
      - if:
          properties:
            depositRequired:
              const: true
          required:
          - depositRequired
        then:
          properties:
            depositType:
              const: PERCENTAGE
            depositValue:
              const: 30
          required:
          - depositValue
      - if:
          properties:
            depositRequired:
              const: false
          required:
          - depositRequired
        then:
          properties:
            depositType:
              const: NONE
      description: Service bat deposit => PERCENTAGE 30 tren final amount sau voucher. Chi Admin cau hinh (global 
        Service). Khong co override theo branch.
    MaterialTemplate:
      type: object
      properties:
