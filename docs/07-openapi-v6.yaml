      description: 'Guest: contact bat buoc; Customer: khong gui contact. petId XOR pet; Guest khong gui petId. Tat ca services
        cung serviceType. GROOMING chi CARE_STAFF_GROOMER; MEDICAL chi NURSE/VETERINARIAN va phai co it nhat mot VETERINARIAN
        segment. Server gan staff va execution fields. Identity rule: Customer uses bearer identity without contact; Guest
        uses verified contact and lookup token after OTP. petId XOR pet. Server validates all segment execution roles and
        availability.'
    AppointmentRequestCreate:
      type: object
      properties:
        serviceIds:
          type: array
