          type: array
          items:
            $ref: '#/components/schemas/StaffAssignment'
          uniqueItems: true
          description: 'Tuy chon: chi dinh staff cho tung segment (role trung voi requiredStaffRole cua segment, dang available).
            Khong gui thi backend tu tim. Chi la phan cong, KHONG lam Appointment CONFIRMED'
      required:
      - branchId
      - serviceIds
      - slotStart
      - paymentMethod
      oneOf:
      - required:
        - customerId
        not:
          required:
          - contact
      - required:
        - contact
        not:
          required:
          - customerId
      description: 'Dat ho Customer(customerId) XOR Guest(contact). petId XOR pet. Staff assignment tuy chon va chi de phan
        cong; backend tim neu thieu. Khong tao CONFIRMED. GROOMING chi CARE_STAFF_GROOMER; MEDICAL chi NURSE/VETERINARIAN
        va phai co it nhat mot VETERINARIAN segment. Identity rule: Customer uses bearer identity without contact; Guest uses
        verified contact and lookup token after OTP. petId XOR pet. Server validates all segment execution roles and availability.'
